[project]
name = "rue"
version = "0.1.0"
description = "Enterprise AI Engineering Project built with Python"
readme = "README.md"
authors = [
    { name = "Huang Feng", email = "huangfeng2@focusmedia.cn" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "httpx>=0.28.1",
    "langchain-community>=0.4.2",
    "onnxruntime>=1.14.0,<1.20.0",
    "optimum[onnxruntime]>=2.1.0",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "tokenizers>=0.20.0",
]

[project.scripts]
rue = "rue.main:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
]


